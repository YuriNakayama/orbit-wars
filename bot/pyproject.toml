[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
exclude = [
    ".venv",
    ".github",
    ".claude",
    "poetry.lock",
    "__pycache__",
    "pipeline/rulebase/case1/notebook",
    "tests/unit/pipeline/rulebase/case1/snapshots",
    # case8 evaluation scripts reference legacy class names that were renamed
    # (DeepSetsPolicy → CandidatePolicy 等)。歴史的参照のために残されている
    # 実行スクリプトで、書き直し / 削除されるまで静的型検査を opt-out する。
    "pipeline/imitation/case8/evaluation/diagnose_weights.py",
    "pipeline/imitation/case8/evaluation/iter6_visualize.py",
    "pipeline/imitation/case8/evaluation/tune_thresholds.py",
]
python_version = "3.13"
strict = true
disallow_any_decorated = false
disallow_any_unimported = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Verbatim port of the LB1224 notebook (untyped). Pure helpers were extracted
# into baseline/core/ but the WorldModel + strategy stays here as one unit.
module = [
    "pipeline.rulebase.case5.baseline.agent_full",
    "pipeline.rulebase.case5.baseline.core.config",
    "pipeline.rulebase.case5.baseline.core.types",
    "pipeline.rulebase.case5.baseline.core.physics",
    "pipeline.rulebase.case5.baseline.core.safety",
    "pipeline.rulebase.case5.baseline.core.world_helpers",
]
ignore_errors = true

[[tool.mypy.overrides]]
# evaluation/snapshot_update.py and tests call into the untyped notebook port.
module = [
    "pipeline.rulebase.case5.evaluation.snapshot_update",
    "tests.unit.pipeline.rulebase.case5.test_core_physics",
    "tests.unit.pipeline.rulebase.case5.test_core_world_helpers",
    "tests.unit.pipeline.rulebase.case5.test_plan_shot_safety",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Pre-existing strict-mode violations (calibrate_heads is ad-hoc tooling and
# train.py uses # type: ignore for torch stub drift). Refactor of these is
# tracked separately from the directory-level work — see
