[project]
name = "orbit-wars"
version = "0.1.0"
description = "Kaggle Orbit Wars competition agents"
readme = "../README.md"
authors = [{ name = "Yuri Nakayama", email = "yuri620620@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "kaggle>=1.6.17",
    "kaggle-environments>=1.17.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "polars>=1.39.0",
    "pyarrow>=23.0.1,<24",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "typer>=0.15.2",
    # torch は base に置かず torch-cpu / torch-cu124 extra で排他選択する
    # (下記 [project.optional-dependencies] と [tool.uv] conflicts)。cu124
    # wheel は nvidia-cudnn-cu12==9.1.0.70 を hard pin し reinforce の cuda
    # group (cudnn 9.8) と単一 lock で衝突するため、GPU torch だけを排他化する。
    "dvc[s3]>=3.55",
    "vastai>=0.3.0",
    "orbit-wars-vendor",
    "orbit-wars-jax",
    "orbit-wars-sim",
    "runpod>=1.7.0",
    "psutil>=6.0.0",
    "scikit-learn>=1.8.0",
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "equinox>=0.11.0",
    "optax>=0.2.0",
]

[project.optional-dependencies]
# torch GPU build (cu124)。imitation/smoke on RunPod 専用の排他 extra。
# RunPod image (cu1241) と一致し cudnn 9.1 を引く → cuda group (cudnn 9.8) と
# 排他 ([tool.uv] conflicts)。CPU build は torch-cpu group (default-groups) 側。
torch-cu124 = ["torch>=2.3.0,<3"]

# PyTorch index 群。explicit=true で torch 系のみに適用し jax/dvc を巻き込まない。
# - cpu  : base の torch (cudnn を引かない)。Linux で cu130 mismatch を回避。
# - cu124: torch-cuda extra 用。RunPod image (cu1241 = CUDA 12.4.1) と一致し、
#          onstart の cu118 fallback を不要化する。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
orbit-wars-vendor = { path = "../simulator/python", editable = true }
orbit-wars-jax = { path = "../simulator/jax", editable = true }
orbit-wars-sim = { path = "../simulator/adapter", editable = true }
# torch index は選択肢で決まる:
# - torch-cpu group  (既定): cpu index。Linux で cu130 mismatch / cudnn を回避。
# - torch-cu124 extra (排他): cu124 index、Linux のみ (RunPod image 一致)。
# macOS は cu124 wheel が無いので marker 不一致で default PyPI (CPU/MPS) に解決。
torch = [
    { index = "pytorch-cu124", extra = "torch-cu124", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", group = "torch-cpu" },
]

# torch-cpu を default group にし、bare `uv sync` (dev/setup, CI, onstart base) で
# CPU torch を既定で入れる。RunPod imitation/smoke だけが
# `--no-default-groups --extra torch-cu124` で GPU build に切替える。これで
# 既存の torch 前提の call site が壊れない。
# 排他宣言: torch-cpu group ⟂ torch-cu124 extra (同一 torch を 2 index から
# 引けない)、torch-cu124 ⟂ cuda (cu124 の cudnn 9.1 vs JAX cuda group の cudnn
# 9.8 衝突)。torch-cpu と cuda は共存可なので reinforce は
# `--group cuda` (torch-cpu は default) で sync できる。
[tool.uv]
# "dev" は uv の既定。torch-cpu を足して bare sync で CPU torch も入るようにする
# (default-groups を指定すると "dev" 既定が上書きされ消えるため明示再追加)。
default-groups = ["dev", "torch-cpu"]
conflicts = [
    [{ group = "torch-cpu" }, { extra = "torch-cu124" }],
    [{ extra = "torch-cu124" }, { group = "cuda" }],
]

[tool.hatch.build.targets.wheel]
packages = ["src/submit", "src/dataset", "src/gpu", "src/evaluate", "src/utils", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# torch CPU build。default group なので bare `uv sync` で入る (dev/CI/onstart base)。
# torch-cu124 extra と排他 ([tool.uv] conflicts)。
torch-cpu = ["torch>=2.3.0,<3"]
dev = [
    { include-group = "lint" },
    { include-group = "env" },
]
lint = [
    "mypy>=1.15.0",
    "pylint>=3.3.2",
    "pytest-coverage>=0.0",
    "pytest>=8.3.4",
    "pytest-xdist>=3.6",
    "ruff>=0.8.4",
    "pandas-stubs>=2.3.2.250926",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.0.20250913",
]
env = [
    # reinforce family は on-policy で env.step() を回すため Rust 製シミュレータ
    # (PyO3 + maturin で build した orbit_wars_rust) を import する。RunPod
    # onstart は uv sync --group env で maturin を取得し
    # `simulator/rust && maturin develop --release` を実行する。
    # imitation case は使わないので install_dependency_groups=[] で必要時のみ.
    "maturin>=1.7,<2",
]
cuda = [
    # GPU pod 用 CUDA12 plugin. `jax[cuda12]` の wheel は Linux x86_64 /
    # aarch64 のみで macOS 用は存在しないので `sys_platform == 'linux'`
    # marker を必須にする。
    # RunPod の bench / GPU training onstart で `uv sync --group cuda
    # --no-dev` を追加実行する想定。実行時 `uv pip install --reinstall
    # jax[cuda12]` は jax 既ロード後の共有ライブラリハンドル invalid
    # 化 (SIGABRT) を踏むので避ける。
    "jax-cuda12-plugin; sys_platform == 'linux'",
    "jax-cuda12-pjrt; sys_platform == 'linux'",
    # CuDNN 9.8 — jax-cuda12-plugin 0.10 は compile-time CuDNN 9.8 を期待
    # するが、RunPod base image は CuDNN 9.1。そのまま実行すると
    # `Loaded runtime CuDNN library: 9.1.0 but source was compiled with:
    # 9.8.0` → `INTERNAL: RET_CHECK failure dnn_support != nullptr` で
    # GPU 演算が abort する (pod 20260520-115638 で観測)。
    # nvidia-cudnn-cu12 wheel を pin して plugin に合わせる。
    "nvidia-cudnn-cu12>=9.8,<9.9; sys_platform == 'linux'",
]


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "site-packages",
    "venv",
    "pipeline/rulebase/case1/notebook",
    ".claude",
]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"pipeline/rulebase/case1/evaluation/**/*.py" = ["B008"]
"pipeline/imitation/case1/training/preprocess.py" = ["B008"]
