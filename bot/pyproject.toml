[project]
name = "orbit-wars"
version = "0.1.0"
description = "Kaggle Orbit Wars competition agents"
readme = "../README.md"
authors = [{ name = "Yuri Nakayama", email = "yuri620620@gmail.com" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "python-dotenv>=1.0.0",
    "kaggle>=1.6.17",
    "kaggle-environments>=1.17.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "polars>=1.39.0",
    "pyarrow>=23.0.1",
    "pydantic>=2.10.6",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "typer>=0.15.2",
    "torch>=2.3.0,<2.7",
    "dvc[s3]>=3.55",
    "vastai>=0.3.0",
    "orbit-wars-vendor",
    "runpod>=1.7.0",
]

[tool.uv.sources]
orbit-wars-vendor = { path = "../simulator/python", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/submit", "src/dataset", "src/vast", "src/runpod_io", "src/evaluation", "src/utils", "pipeline"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "env" },
    "scikit-learn>=1.8.0",
]
lint = [
    "mypy>=1.15.0",
    "pylint>=3.3.2",
    "pytest-coverage>=0.0",
    "pytest>=8.3.4",
    "pytest-xdist>=3.6",
    "ruff>=0.8.4",
    "pandas-stubs>=2.3.2.250926",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.0.20250913",
]
env = []


[tool.ruff]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "site-packages",
    "venv",
    "pipeline/rulebase/case1/notebook",
    ".claude",
]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = []
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.mccabe]
max-complexity = 5

[tool.ruff.lint.per-file-ignores]
"pipeline/rulebase/case1/evaluation/**/*.py" = ["B008"]
"pipeline/imitation/case1/training/preprocess.py" = ["B008"]
"pipeline/imitation/case1/training/train.py" = ["B008"]
"pipeline/imitation/case1/evaluation/eval_vs_baseline.py" = ["B008"]
"pipeline/imitation/case2/training/preprocess.py" = ["B008", "E501"]
"pipeline/imitation/case2/training/train.py" = ["B008"]
"pipeline/imitation/case3/training/preprocess.py" = ["B008", "E501", "E731"]
"pipeline/imitation/case3/training/train.py" = ["B008"]
"pipeline/imitation/case5/training/preprocess.py" = ["B008", "E501"]
"pipeline/imitation/case5/training/train.py" = ["B008"]
"pipeline/imitation/case5/evaluation/eval_vs_baseline.py" = ["B008"]
"pipeline/imitation/case5/policy/timeline.py" = ["E501"]
# Test fixtures often need long inline literals; readability wins over 88-char limit.
"tests/pipeline/**/test_*.py" = ["E501"]
"tests/pipeline/rulebase/case1/snapshots/**" = ["ALL"]
"pipeline/rulebase/case2/baseline/**/*.py" = ["C901", "E501", "PLR0912", "PLR0913", "PLR0915"]
"pipeline/rulebase/case2/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case2/snapshots/**" = ["ALL"]
"pipeline/rulebase/case3/baseline/**/*.py" = ["C901", "E501", "PLR0912", "PLR0913", "PLR0915"]
"pipeline/rulebase/case3/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case3/snapshots/**" = ["ALL"]
"pipeline/rulebase/case4/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case4/snapshots/**" = ["ALL"]
"pipeline/rulebase/case5/baseline/**/*.py" = ["C901", "E501", "PLR0912", "PLR0913", "PLR0915", "B905"]
"pipeline/rulebase/case5/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case5/snapshots/**" = ["ALL"]
"pipeline/rulebase/case6/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case6/snapshots/**" = ["ALL"]
"pipeline/rulebase/case7/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case7/snapshots/**" = ["ALL"]
"pipeline/rulebase/case9/evaluation/**/*.py" = ["B008", "E501"]
"tests/pipeline/rulebase/case9/snapshots/**" = ["ALL"]
"src/submit/__main__.py" = ["B008"]  # typer は引数デフォルトで Option を呼ぶのが標準
"src/dataset/cli.py" = ["B008"]  # typer の慣習
"src/vast/cli.py" = ["B008", "E501"]  # typer の慣習 + 日本語 docstring
"src/runpod_io/cli.py" = ["B008", "E501"]  # typer の慣習 + 日本語 docstring
"pipeline/rulebase/case1/eda/**/*.py" = ["B018"]  # # %% セルで式だけの行が出力確認用

[tool.ruff.lint.isort]
case-sensitive = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
exclude = [
    ".venv",
    ".github",
    ".claude",
    "poetry.lock",
    "__pycache__",
    "pipeline/rulebase/case1/notebook",
    "tests/pipeline/rulebase/case1/snapshots",
]
python_version = "3.13"
strict = true
disallow_any_decorated = false
disallow_any_unimported = false
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
strict_optional = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Verbatim port of the LB1224 notebook (untyped). Pure helpers were extracted
# into baseline/core/ but the WorldModel + strategy stays here as one unit.
module = [
    "pipeline.rulebase.case5.baseline.agent_full",
    "pipeline.rulebase.case5.baseline.core.config",
    "pipeline.rulebase.case5.baseline.core.types",
    "pipeline.rulebase.case5.baseline.core.physics",
    "pipeline.rulebase.case5.baseline.core.world_helpers",
]
ignore_errors = true

[[tool.mypy.overrides]]
# evaluation/snapshot_update.py and tests call into the untyped notebook port.
module = [
    "pipeline.rulebase.case5.evaluation.snapshot_update",
    "tests.pipeline.rulebase.case5.test_baseline_agent",
    "tests.pipeline.rulebase.case5.test_core_physics",
    "tests.pipeline.rulebase.case5.test_core_world_helpers",
]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Pre-existing strict-mode violations (calibrate_heads is ad-hoc tooling and
# train.py uses # type: ignore for torch stub drift). Refactor of these is
# tracked separately from the directory-level work — see
# docs/plans/refactor-directory/05-risks.md for the rationale.
module = [
    "pipeline.imitation.case2.scripts.calibrate_heads",
    "pipeline.imitation.case3.scripts.calibrate_heads",
    "pipeline.imitation.case2.training.train",
    "pipeline.imitation.case3.training.train",
    "pipeline.imitation.case5.training.preprocess",
    "pipeline.imitation.case5.training.train",
    "pipeline.imitation.case5.evaluation.eval_vs_baseline",
    "pipeline.imitation.case5.evaluation.calibrate_heads",
]
ignore_errors = true

[tool.pytest.ini_options]
addopts = [
    '--rootdir=tests',
    '--strict-config',
    '--cov=src',
    '--log-cli-level=INFO',
    '-p no:cacheprovider',
    '-ra',
]
testpaths = ['tests']
cache_dir = "tests/.pytest_cache"
filterwarnings = ["ignore::pydantic.PydanticDeprecatedSince20"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests",
    "slow: marks tests as slow (self-play episodes, training runs)",
]

[tool.coverage.run]
branch = true
omit = ["**/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "if __name__ == .__main__.",
]

[tool.coverage.xml]
output = "tests/coverage/coverage.xml"

[tool.coverage.html]
directory = "tests/coverage/report"

[tool.pyright]
typeCheckingMode = "basic"
include = ["src", "tests"]
exclude = [
    ".venv",
    "**/traces",
    "**/traces_ts",
    "**/example_files**",
    "**/.pkl",
    "**/bazel-bin",
    "**/bazel",
    "**/resources/**",
    "**/tests/**",
    "**/node_modules",
    "**/.next",
    "**/__pycache__",
    "**/.coverage/**",
    "**/.git",
    "**/dist/**",
    "**/build/**",
    "**/.husky",
    "**/migrations",
]
ignore = [
    "**/node_modules",
    "**/__pycache__",
    "**/.*",
    "**/dist",
    "**/.vscode",
    "**/*.pyi",
    "**/__init__.py",
]
venvPath = "."
venv = ".venv"

[tool.pylint]
ignore-paths = [".venv", ".github"]
max-line-length = 88
