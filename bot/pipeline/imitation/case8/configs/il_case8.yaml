# imitation/case8: candidate head + ship-count regression head BC
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case8/train.parquet
  out_val: data/mart/imitation/case8/val.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 35
  global_in_dim: 20
  cand_in_dim: 14
  cand_k: 8
  hidden: 128

train:
  case: case8
  batch_size: 256
  # iter2-sanity: epochs=2 で SequentialLR が GPU 環境で hang するか切り分け
  # (full epochs=30 は debug 後に元に戻す)
  epochs: 2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    cand: 1.0
    use_class_weights: true
    class_weight_beta: 0.999
    label_smoothing: 0.05
    ship: 1.0
  # iter2-sanity: scheduler を維持して hang 再現を狙う (cosine_warmup)
  scheduler:
    type: cosine_warmup
    t_max: 2
    eta_min: 1.0e-5
    warmup_epochs: 1
    warmup_start_factor: 0.1
  best_metric: val_cand_fire_acc
  best_metric_mode: max
  early_stop:
    metric: val_cand_fire_acc
    patience: 1
    mode: max
  weights_out: pipeline/imitation/case8/policy/weights.pt

inference:
  temperature: 1.0
