# imitation/case8: candidate head + ship-count regression head BC
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case8/train.parquet
  out_val: data/mart/imitation/case8/val.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 35
  global_in_dim: 20
  cand_in_dim: 14
  cand_k: 8
  hidden: 128

train:
  case: case8
  # iter9: iter3 hyperparams を完全再現 (= iter4 で導入した grad_clip / dropout
  # / EMA は 8 連続 hang したため全部無効) + iter5 lazy dataset を維持。
  # batch_size を iter3 と同じ 256 に戻す (in-memory dataset で動いた値、
  # lazy dataset でも GPU memory には影響しないため安全)。
  batch_size: 256
  epochs: 30
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    cand: 1.0
    use_class_weights: true
    class_weight_beta: 0.999
    # iter3: focal loss を有効化、label_smoothing は focal と非整合なので 0.0
    label_smoothing: 0.0
    cand_loss_type: focal
    focal_alpha: 0.25
    focal_gamma: 2.0
    ship: 1.0
  # iter2: cosine annealing + warmup で cand head の振動を抑制 (iter1 で
  # epoch ごとに val_cand_acc が 0.01-0.37 で振動した課題への対症)。
  # iter2-sanity (epochs=2) で A6000 に scheduler が問題なく動く挙動を確認済み。
  scheduler:
    type: cosine_warmup
    t_max: 30
    eta_min: 1.0e-5
    warmup_epochs: 2
    warmup_start_factor: 0.1
  # iter2: best.pt の選定基準を val_total → val_cand_fire_acc に変更。
  best_metric: val_cand_fire_acc
  best_metric_mode: max
  early_stop:
    metric: val_cand_fire_acc
    patience: 5
    mode: max
  # iter11: 8 連続 hang の真の root cause は onstart の `uv run --project bot`
  # による venv race condition (iter9 で `Installed 180 packages` retry chain、
  # iter10 で dvc pull 中に `Uninstalled 25 packages + ModuleNotFoundError
  # rich._emoji_codes` を観測) と確定。bot/src/runpod_io/onstart.sh.tmpl で
  # `.venv/bin/{python,dvc}` 直接呼びに統一して race を排除した上で、本来
  # iter4 で意図した stabilization knobs (grad_clip + EMA + head_dropout)
  # を再投入し val_total max/min < 2.0 を計測する。
  grad_clip_max_norm: 1.0
  ema:
    enabled: true
    decay: 0.999
  head_dropout: 0.2
  weights_out: pipeline/imitation/case8/policy/weights.pt

inference:
  temperature: 1.0
