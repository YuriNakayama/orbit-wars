# Phase 2: imitation/case3 with history features (planet 35 / global 20).
# Builds on Phase 1 final (case2 phase1 with group D dropped) and adds:
#   - planet history: delta_ships_t1, delta_ships_t2, owner_changed_t1
#   - global history: enemy/ally launch count & ships over last 4 turns
# Reuses the same rating_quantile / val_split / seed as case2 baseline so
# results are directly comparable at the validation metric level.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  featurizer: phase2
  out_train: data/mart/imitation/case3/train_phase2_fixed.parquet
  out_val: data/mart/imitation/case3/val_phase2_fixed.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 35
  global_in_dim: 20
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 3.0
    from_focal_alpha: 0.75
    target_label_smoothing: 0.15
    target_entropy_bonus: 0.05
    use_target_class_weights: true
    target_class_weight_beta: 0.9999
    use_ships_class_weights: false
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.0
  weights_out: pipeline/imitation/case3/policy/weights_iter1.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: null
  target_temperature: 0.8
  ships_temperature: 1.1
