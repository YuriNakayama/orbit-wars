# imitation/case9 candidate variant: per-source × CAND_K categorical + SmoothL1 ship_pred.
# Featurizer = case8 base 35 + case5 timeline 6 = PLANET=41. Backbone = SetT 128.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case9/train.parquet
  out_val: data/mart/imitation/case9/val.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 41
  global_in_dim: 20
  cand_in_dim: 14
  cand_k: 8
  hidden: 128
  attn_heads: 4
  inducing_points: 16
  encoder_layers: 3
  head_mode: candidate

train:
  case: case9
  batch_size: 128
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    cand: 1.0
    use_class_weights: true
    class_weight_beta: 0.999
    label_smoothing: 0.0
    cand_loss_type: focal
    focal_alpha: 0.25
    focal_gamma: 2.0
    ship: 1.0
  scheduler:
    type: cosine_warmup
    t_max: 15
    eta_min: 1.0e-5
    warmup_epochs: 2
    warmup_start_factor: 0.1
  best_metric: val_cand_fire_acc
  best_metric_mode: max
  early_stop:
    metric: val_cand_fire_acc
    patience: 5
    mode: max
  grad_clip_max_norm: 1.0
  ema:
    enabled: false
    decay: 0.999
  head_dropout: 0.2
  weights_out: pipeline/imitation/case9/policy/weights_candidate.pt

inference:
  temperature: 1.0
