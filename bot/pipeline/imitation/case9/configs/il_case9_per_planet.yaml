# imitation/case9 per_planet variant.
# Per-source × (P+1) target categorical (planet_id 直接予測 + no-op sentinel) +
# log1p(ships) regression head. Backbone = Set Transformer hidden=192 / ISABx4 /
# heads=8 / inducing=24 (other case9 variants と一致).
#
# データフィルタ (新規 mart 生成時に有効):
#   winners_only: true       — 勝者側スロットの frame のみ使用
#   top_team_rank: 80        — agent_<slot>_team_rank が 1..80 の試合のみ
#   rating_quantile: 0.0     — winners + top_rank で十分絞り込み済みなので 0
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  out_train: data/mart/imitation/case9_per_planet/train.parquet
  out_val: data/mart/imitation/case9_per_planet/val.parquet
  rating_quantile: 0.0
  val_split: 0.10
  modes: ["1v1"]
  # 5000 episodes ≒ 12000 1v1 試合のうち上位 ~5000 を採用。winners + top80 で
  # 落ちる分を見越して max_episodes は元データの ~30% で設定。これで train
  # parquet を ~3.5GB に圧縮し、host RAM OOM (exit 137) を回避する。
  max_episodes: 8000
  winners_only: true
  top_team_rank: 80

model:
  planet_in_dim: 41
  global_in_dim: 20
  cand_in_dim: 14
  cand_k: 8
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_mode: per_planet

train:
  case: case9
  batch_size: 512
  epochs: 45
  lr: 3.0e-4
  weight_decay: 1.0e-4
  num_workers: 0
  pin_memory: true
  loss_weights:
    target: 1.0
    ship: 0.5
    use_class_weights: false
    label_smoothing: 0.0
  scheduler:
    type: cosine_warmup
    t_max: 45
    eta_min: 1.0e-5
    warmup_epochs: 3
    warmup_start_factor: 0.1
  best_metric: val_target_fire_acc
  best_metric_mode: max
  early_stop:
    metric: val_target_fire_acc
    patience: 10
    mode: max
  grad_clip_max_norm: 1.0
  ema:
    enabled: false
    decay: 0.999
  head_dropout: 0.1
  weights_out: pipeline/imitation/case9/policy/weights_per_planet.pt

inference:
  temperature: 1.0
