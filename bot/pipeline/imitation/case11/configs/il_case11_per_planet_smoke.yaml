# Smoke-run variant of il_case11_per_planet.yaml for verifying the
# per-epoch S3 best.pt upload flow end-to-end. Reduces train/val rows
# to ~20k / 2k so a 3-epoch run finishes in a handful of minutes.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case11/train.parquet
  out_val: data/mart/imitation/case11/val.parquet
  rating_quantile: 0.0
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null
  winners_only: true
  top_team_rank: 80
  # smoke-only caps: pulled by train.py dataset constructor
  max_train_rows: 20000
  max_val_rows: 2000

model:
  planet_in_dim: 41
  global_in_dim: 20
  cand_in_dim: 14
  cand_k: 8
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_mode: per_planet

train:
  case: case11
  batch_size: 1024
  epochs: 3
  lr: 6.0e-4
  weight_decay: 1.0e-4
  num_workers: 4
  pin_memory: false
  persistent_workers: true
  loss_weights:
    target: 1.0
    ship: 0.5
    use_class_weights: false
    label_smoothing: 0.0
  scheduler:
    type: cosine_warmup
    t_max: 3
    eta_min: 1.0e-5
    warmup_epochs: 1
    warmup_start_factor: 0.1
  best_metric: val_target_fire_acc
  best_metric_mode: max
  early_stop:
    metric: val_target_fire_acc
    patience: 3
    mode: max
  grad_clip_max_norm: 1.0
  ema:
    enabled: false
    decay: 0.999
  head_dropout: 0.1
  weights_out: pipeline/imitation/case11/policy/weights.pt

inference:
  temperature: 1.0
