# case6 smoke test: 最小規模で preprocess + train を end-to-end 走らせて
# コードロジックの sanity check を行うための config。
# max_episodes=10, epochs=2 で 1-2 分以内に完走見込み (ローカル CPU)。
# RunPod に投げる前のローカル smoke 用、本番学習には il_case6.yaml を使う。
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case11_smoke/train.parquet
  out_val: data/mart/imitation/case11_smoke/val.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: 10  # smoke: 10 episodes だけ処理

model:
  planet_in_dim: 17
  global_in_dim: 6
  hidden: 128
  ships_buckets: 4
  attn_heads: 4
  inducing_points: 16
  encoder_layers: 3

train:
  batch_size: 32  # 小さいデータなので batch も小さく
  epochs: 2  # smoke: 2 epoch だけ
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 3.0
    from_focal_alpha: 0.75
    target_label_smoothing: 0.15
    target_entropy_bonus: 0.05
    use_target_class_weights: true
    target_class_weight_beta: 0.9999
    use_ships_class_weights: false
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.0
  weights_out: bot/pipeline/imitation/case11/policy/weights_smoke.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: null
  target_temperature: 0.8
  ships_temperature: 1.1

evaluation:
  metrics_out: data/mart/imitation/case11_smoke/eval_metrics.json
  episodes: 5
  seed: 0
