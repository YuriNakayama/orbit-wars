# Local smoke for python_v1 host-callback opponent (NEW, sha dc13a25).
# Opponent = real Python baseline_v1 via jax.pure_callback (vmap_method=
# 'sequential'). 2-iter wiring check; the goal here is just to confirm:
#   (a) the rollout traces with the new dispatch branch on,
#   (b) pure_callback fires per-game without blowing up the jit graph,
#   (c) train.py + PPO update consume the rollout without shape mismatch.
# Real win-rate signal requires longer iters (a follow-up Kaggle / RunPod run).
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 2
  episodes_per_iter: 4
  horizon: 50
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  shaping_coef: 0.001
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.001
  kl_beta: 0.0
  ppo_epochs: 1
  minibatch_size: 64
  max_grad_norm: 0.5
  target_kl: null
  opponent: python_v1

output:
  run_dir: data/output/models/reinforce/case6_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
