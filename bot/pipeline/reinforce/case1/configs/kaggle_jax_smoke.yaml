# Kaggle Kernel JAX smoke config for reinforce/case1 (BC warm-start OFF).
#
# Mirrors `train_jax_smoke.yaml` but uses production-scale rollout shape
# (16 ep × 500 step) so the wall-clock per iter is comparable to README's
# RTX 4090 measurement (15s/iter warm). On Kaggle T4x2 we expect 1-3 min/iter
# depending on XLA compile + per-step compute density.
#
# BC warm-start stays OFF because the Kaggle Kernel dataset doesn't yet ship
# the case9 per_planet BC checkpoint; that's a separate transport problem.

model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 6
  episodes_per_iter: 16
  horizon: 500
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  shaping_coef: 0.001
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.001
  kl_beta: 0.0  # no BC reference => no KL anchor
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: null
  opponent: noop

output:
  run_dir: data/output/models/reinforce/case1_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
