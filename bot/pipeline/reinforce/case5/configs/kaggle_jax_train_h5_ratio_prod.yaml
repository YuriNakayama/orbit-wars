# reinforce/case5 — support_reward H5 (production 加重保持割合 shaping)
#
# H4 (ratio coef=1.0, count-based planet ratio) が lite last-10 0.820 で現行最良。
# 本 config は planet 信号を「production 加重」保持割合に置き換えた ratio_prod mode で、
# 高 production 惑星の保持を重く評価し last-10 をさらに押し上げるか検証 (H5)。
#
# 差分点 (= kaggle_jax_train_h4_ratio_coef1.yaml):
#   - shaping_mode: ratio → ratio_prod
#     (Φ_ship = ship 保持割合、Φ_planet = prod_mine/(prod_mine+prod_enemy))
#   shaping_coef=1.0 は H4 据え置き。
#
# 採否: H4 (count ratio, 0.820) 比 +3pp で production 加重採用、悪化なら count ベース維持。
# GPU: 3090/4090 限定 (A100 除外)。
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 200
  episodes_per_iter: 128
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 100000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_coef: 1.0           # H4 据え置き (ratio_prod の ship/planet 両割合に等加算)
  shaping_mode: ratio_prod    # H5: planet を production 加重保持割合に
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 5
    early: noop
    late: baseline_jax_lite

output:
  run_dir: data/output/models/reinforce/case5_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
