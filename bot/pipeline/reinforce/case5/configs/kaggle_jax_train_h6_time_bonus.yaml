# reinforce/case5 — support_reward H6 (勝ちターン短縮 time bonus + 引き伸ばし penalty)
#
# H4 (ratio coef=1.0) base に時間方向の整形を重畳:
#   - 勝利 terminal 時に time_bonus_coef · (1 - turn/horizon) を加算 (早期勝利報酬)
#   - 各 turn に -time_penalty_coef を加算 (累積で長期に不利)
# time_bonus は terminal 時のみで PBRS とは独立、PBRS 性質を破壊しない。
# H3 (絶対 dense) が引き伸ばしバイアスで rejected された対照に、時間圧力で
# 勝てるターンを早めるか検証 (H3 と pair の試行的仮説)。
#
# 差分点 (= kaggle_jax_train_h4_ratio_coef1.yaml):
#   - time_bonus_coef: 0.0 → 0.5  (勝利時最大 +0.5 ボーナス)
#   - time_penalty_coef: 0.0 → 0.001 (500 turns で累積 -0.5)
#   それ以外は H4 と完全同一 (shaping_mode=ratio, coef=1.0, 200 iter, curriculum 等)。
#
# 採否: H4 (0.820) 比 +3pp で採用、同等は inconclusive、劣化なら rejected。
# GPU: 3090/4090 限定 (consumer)。
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 200
  episodes_per_iter: 128
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 100000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_coef: 1.0       # H4 据え置き
  shaping_mode: ratio
  shaping_clip: 0.0       # clip なし
  dense_coef_ship: 0.0    # dense なし (H3 系は無効)
  dense_coef_planet: 0.0
  time_bonus_coef: 0.5    # H6: 早期勝利報酬
  time_penalty_coef: 0.001  # H6: 引き伸ばしペナルティ
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 5
    early: noop
    late: baseline_jax_lite

output:
  run_dir: data/output/models/reinforce/case5_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
