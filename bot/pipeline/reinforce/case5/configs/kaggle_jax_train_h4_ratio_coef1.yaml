# reinforce/case5 — support_reward H4 (ratio 係数 sweep: coef 1.0)
#
# H2 ratio (coef=0.50) が lite last-10 0.763 / trend +0.651 で圧勝。ratio は
# [0,1] 正規化のため ΔΦ が小さく value_loss も 0.005 と余裕あり。本 config は
# shaping_coef のみ 0.50 → 1.0 に倍増し、ratio 信号強化で last-10 を押し上げるか検証。
#
# 差分点 (= kaggle_jax_train_h2_ratio.yaml):
#   - shaping_coef: 0.50 → 1.0  (ratio mode、ship/planet 両割合に等加算)
#   それ以外は H2 と完全同一 (shaping_mode=ratio / 200 iter / curriculum 等)。
#
# 採否: H2 (0.763) 比 +3pp で coef=1.0 採用、悪化 (value_loss↑/approx_kl>0.05) なら 0.50 維持。
# GPU: 3090/4090 限定 (A100 除外、コスト抑制)。
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 200
  episodes_per_iter: 128
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 100000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_coef: 1.0       # H4: 0.50 → 1.0 (ratio 信号倍増)
  shaping_mode: ratio
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 5
    early: noop
    late: baseline_jax_lite

output:
  run_dir: data/output/models/reinforce/case5_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
