# case7 H5: scale-up to 300 iter — H4 (150 iter) PROVED scale works: win vs
# baseline_jax_full climbed 0.231 (iter0-50) -> 0.338 (50-100) -> 0.469 (100+),
# reaching parity (peaks 0.50-0.56). The 20-iter ~0.3 ceiling was under-training,
# not intrinsic. H5 doubles to 300 iter to push the win rate consistently >0.5.
#
# Same healthy setup: PFSP self_snapshot pool (f_hard) + baseline_jax_full mix +
# dense diff reward. No BC (H3 harmful), kl_beta=0.
#
# ~300 iter × ~26s = ~130min on RTX 4090. Crash-safe per-iter S3.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 300
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 40000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  # PFSP self_snapshot pool (f_hard) + baseline_jax_full mix — the healthiest
  # opponent dynamics from the original PoC (self_snapshot recovered to ~0.5).
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8       # push current model every 8 iters (more snapshots over 300)
    cap: 6                  # larger pool for the longer run (300 iter)
    late_full_prob: 0.4     # 40% baseline_jax_full, else a pooled past self
    priority: f_hard
    priority_p: 2.0
    priority_ema: 0.7

output:
  run_dir: data/output/models/reinforce/case7_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
