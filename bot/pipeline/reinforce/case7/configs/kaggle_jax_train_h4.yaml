# RunPod JAX training config for reinforce/case7 — H4 (PFSP f_hard sampling).
#
# H2 (uniform pool/full mix) は vs baseline_jax_full が 0.359 で頭打ち。H4 =
# 対戦相手を f_hard(x)=(1−x)^p で優先 sampling (x=対相手勝率 EMA)。勝てない相手
# (full / 強い pool snapshot) を高確率で選び、難敵への学習を集中させる (AlphaStar 主手法)。
#
# 比較基準 (H2): vs full last10≈0.359 / win last10=0.661 / entropy 38→47。
# 期待: vs full の last10 / slope が H2 を上回る。
#
# コスト方針 (H1 が $7.1 で cap 超過): iterations 100 / episodes 64 / RTX 4090 優先。
# ⚠️ uptime ベースで手動 cost 監視 (status の est_total=$0.000 バグ)。~$1.0 目標。
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 100
  episodes_per_iter: 64
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 50000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_coef: 0.50
  shaping_mode: planets
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 5
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 10
    cap: 5
    priority: f_hard     # H4: (1−x)^p 優先 sampling (H2 は uniform)
    priority_p: 2.0      # 重み指数: 勝てない相手ほど高確率
    priority_ema: 0.7    # per-opponent 勝率 EMA の平滑化

output:
  run_dir: data/output/models/reinforce/case7_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
