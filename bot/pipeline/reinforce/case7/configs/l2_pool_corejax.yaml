# case7 L2: PFSP self_snapshot pool + core_jax (faithful v1) as the rulebase
# opponent. L1 (direct vs core_jax) confirmed the sparse-gradient wall: the agent
# can't beat a strong v1-like opponent from scratch (win stuck at 0).
#
# Fix (H4's healthy recipe, but with the FAITHFUL opponent): noop warmup →
# f_hard PFSP pool = self_snapshot (the agent improves against itself, non-
# saturating) + core_jax (the faithful ~80% v1 target, 40% mix). f_hard weights
# toward opponents the agent can't yet beat, concentrating learning. Crucially,
# the pool's "full" opponent is core_jax (not baseline_jax_full's 10% approx), so
# progress should transfer to the real v1 at eval — the whole point of the parity
# work.
#
# Eval: final ckpt vs REAL baseline_v1 (30 games). 100 iter (scale + pool need
# room). dense diff reward for gradient.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 100
  episodes_per_iter: 16
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 5
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 6
    cap: 6
    late_full_prob: 0.4
    priority: f_hard
    priority_p: 2.0
    priority_ema: 0.7
    full_opponent: baseline_core_jax   # faithful v1 opponent (not the 10% approx)

output:
  run_dir: data/output/models/reinforce/case7_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
