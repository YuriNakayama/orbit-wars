# case7 H5: f_var matchmaking + held-out eval + Elo.
#
# Keep the match near the agent's current skill (PFSP priority=f_var weights
# ~even opponents x(1-x)), so the per-iter win-rate stays ~0.5 by design and the
# learning signal stays dense. Because match win-rate is then NOT a progress
# signal, progress is measured matchmaking-free:
#   - heldout_eval: win-rate vs a FIXED opponent (baseline_jax_full) every 5
#     iters with a fixed seed  → absolute progress curve.
#   - agent_elo: Elo anchored to that fixed reference → relative skill curve.
#   - entropy (in metrics) → health (collapse if it falls <10).
#
# Pool: self_snapshot (f_var) + baseline_jax_full mix. iterations 80 (~35min on
# RTX 4090). Per-iter ckpt+metrics to S3 (crash-safe).
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 80
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 12000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  # matchmaking-free progress measurement
  heldout_eval:
    every: 5                    # eval vs fixed opponent every 5 iters
    opponent: baseline_jax_full
    episodes: 32
    seed: 777000                # fixed → comparable curve across iters
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  # PFSP: f_var keeps the match near current skill (win-rate ~0.5)
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var             # ← x(1-x): concentrate on ~even opponents
    priority_p: 2.0
    priority_ema: 0.7

output:
  run_dir: data/output/models/reinforce/case7_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
