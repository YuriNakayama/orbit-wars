# case7: LIGHT (~10min) PPO vs core_jax + strict host-loop held-out.
# 12 iter, train vs baseline_core_jax (fast ~18s/iter on GPU); strict held-out
# every 6 iters (16 games, host-loop). Smoke-scale verification of the full
# fast-train + faithful-strict-verify pipeline on GPU.
model: {hidden: 192, attn_heads: 8, inducing_points: 24, encoder_layers: 4, head_dropout: 0.0, ship_log_std_init: 0.5, no_op_bias: 8.0}
bc_warmstart: {enabled: false, weights_path: ""}
training:
  seed: 0
  iterations: 12
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: baseline_core_jax
  heldout_eval: {every: 11, opponent: baseline_strict_jax, episodes: 8, seed: 777000, ref_elo: 1500.0, agent_elo_init: 1500.0, elo_k: 32.0}
output: {run_dir: data/output/models/reinforce/case7_train_jax/runs, weights_filename: best.pt, metrics_filename: metrics.json, run_meta_filename: run.json}
