# RunPod JAX training config for reinforce/case7 — H2 (PFSP snapshot pool).
#
# H1 で frozen iter0 snapshot 相手は surpass 後に信号枯渇 (win~1.0 飽和) と判明。
# H2 = snapshot を K iter ごとに pool 追加し、late 相手を pool スナップショット or
# baseline_jax_full から確率選択。相手を学習に追従させ win_rate を中間域に保つ狙い。
#
# コスト軽量化 (H1 が 5.1h/$7.1 で cap 超過したため):
#   - iterations: 200 → 100
#   - episodes_per_iter: 128 → 64
#   self_snapshot は rollout ~2倍重。上記で ~$2-3 (A100 fallback 時) を目標。
#   ⚠️ uptime ベースで手動 cost 監視 (status の est_total=$0.000 バグ)。
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 100
  episodes_per_iter: 64
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 50000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_coef: 0.50
  shaping_mode: planets
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 5
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 10  # K: 10 iter ごとに最新 snapshot を pool へ
    cap: 5              # FIFO pool サイズ
    late_full_prob: 0.5 # late iter で baseline_jax_full を選ぶ確率 (残りは pool snapshot)

output:
  run_dir: data/output/models/reinforce/case7_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
