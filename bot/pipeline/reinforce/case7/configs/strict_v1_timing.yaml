# GPU timing probe: PPO with opponent=strict_jax_v1 (pool side), episodes=8 h500.
# Measures rollout secs/iter with the in-JAX 90%-parity v1 (post 2026-06-11
# speedups). The companion strict_v1_timing16.yaml (episodes=16) measures the
# holdout-eval-shaped cost; pool+holdout per-iter = rollout8 + update + rollout16.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 5
  episodes_per_iter: 8
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 10000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_coef: 0.50
  shaping_mode: planets
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: strict_jax_v1

output:
  run_dir: data/output/models/reinforce/case7_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
