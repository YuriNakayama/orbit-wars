# ============================================================================
# Ladder-pool iteration 8 (loop tick の工夫: 2軸 (T0, ε) ハイブリッド ladder)。
#
# iter7 (run 20260612-045212) までの観測: T0 ラダーで 250→150 までフロンティアが
# 降下した一方、held-out strict_v1 は 0 のまま (単発 1/64 のみ)。web 調査の結論:
# T0 時間窓型は「strict の序盤を一度も見ない」end-game-first 盲点を持ち、終端
# (T0=0) で難易度の崖が生じる。工夫 (1点): ladder を 2軸化 — T0 段 (序盤 noop)
# に加えて ε 段 (T0=0、ターン毎確率 ε で noop = strict の序盤も確率的に露出) を
# 追加し、最終段 (0,0)=素 strict を force_rung_low_every で定期照射して
# in-training 進捗プローブ + 勾配機会を確保する。ε 値域は phaseB の壁 (ε=0.85
# で 0 勝、当時は弱モデル) と現在の強化済みモデルを踏まえ 0.9-0.5 をスパン。
# resume は iter7 best.pt。他は iter7 と完全同一。
# ============================================================================
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""


training:
  algo: vmpo
  seed: 0
  resume_from: data/output/models/reinforce/case8_vmpo_ladder7/runs/20260612-045212__feature-poc-v-mpo__b212896__seed0/best.pt
  iterations: 70
  episodes_per_iter: 96
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  heldout_eval:
    every: 10                # iter 0/10/20/30/40/50/60/69 (warm ~3分/eval)
    opponents: [strict_v1, baseline_jax_full]  # 真の強さ + 変化検出用の両観測
    episodes: 64             # バッチ償却で eval 時間は episodes にほぼ不変
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  handicap:
    enabled: false           # ladder-pool では不使用 (段選択 = f_var が担う)
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 0
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var
    priority_p: 4.0
    priority_ema: 0.7
    include_lite: false      # exploiter 構成: pool は strict ラダー + self のみ
    include_full: false
    include_v8: false
    include_strict: [strict_v1]
    force_strict_every: 0    # 不要: 素 strict 照射は force_rung_low_every が担う
    # 2軸ハイブリッド: [T0, ε] ペア。前半 = iter7 フロンティア帯の T0 段、
    # 後半 = ε 段 (序盤露出ブリッジ)、最終段 = 素 strict (定期照射プローブ)。
    strict_ladder:
      - [200, 0.0]
      - [150, 0.0]
      - [100, 0.0]
      - [0, 0.9]
      - [0, 0.8]
      - [0, 0.65]
      - [0, 0.5]
      - [0, 0.0]
    force_rung_low_every: 10 # 10 iter 毎に最終段 (素 strict) を強制選択
    mix_strict: 0.6          # 60% strict ラダー (iter3 の工夫: フロンティア密度up)
    mix_self: 0.35           # 35% self snapshots / 残り 15% 最古 snapshot

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
