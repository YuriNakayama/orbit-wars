# ============================================================================
# V-MPO + strict_v1 を held-out 進捗 yardstick のみに使う軽量版。
#
# 経緯: vmpo_strict.yaml (pool+held-out 両方に strict v1/v2/v3) は iter0 が
# GPU 100% で >13分 完了せず打ち切り。原因 = strict compute_actions グラフが
# 巨大で per-iter 実行が重い (held-out strict_v1 32戦×500手 が主犯)。
#
# 対策 (ユーザー選択「held-out のみ strict_v1」):
#   - pool = in-JAX baseline_jax full + lite + self (strict を pool から除外)。
#     rollout は軽量な in-JAX 相手のみ => switch の strict branch (mode 7/8/9)
#     は trace/compile されるが実行されない (per-iter 実行コストは in-JAX 相当)。
#   - strict_v1 は held-out 評価のみで実行。頻度・規模を絞り tractable 化:
#       every: 5 (毎iter → 5iterに1回)、episodes: 16 (32 → 16)。
#     1回の strict eval が依然重ければ strict 実行自体が非現実的と確定する。
#
# これは vmpo_frozen.yaml から「held-out opponent を strict_v1 に、頻度/規模を
# 縮小」しただけの差分。A/B 規律: pool/学習 HP は vmpo_frozen と同一に保つ。
# ============================================================================
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  algo: vmpo
  seed: 0
  iterations: 30
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  heldout_eval:
    every: 5                 # strict 実行コスト抑制: 5iterに1回のみ
    opponent: strict_v1   # 進捗 yardstick = strict JAX rulebase case1
    episodes: 16             # strict 実行コスト抑制: 32 → 16
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var
    priority_p: 4.0
    priority_ema: 0.7
    include_lite: true       # pool = in-JAX full + lite + self (strict 除外)
    include_v8: false
    include_strict: []       # ★strict を pool から除外 (held-out のみで使用)

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
