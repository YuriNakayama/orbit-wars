# ============================================================================
# Ladder-pool iteration 10 (loop tick の工夫: フロンティア低 T0 シフト)。
#
# ladder9 (T0崖密刻み, run 20260613-073911, 70 iter完走) の観測: T0崖の密刻みが
# 奏功し held-out full が 0.672 → 0.797 (it60, 全run最高) へ +12.5pp、崖が滑らか
# な連続勾配に (T0=225:0.70, 185:0.49, 170:0.40, 155:0.35, 140:0.2-0.32, 125:0.17,
# 110:0.09)。全敗汚染も force_rung_low 廃止でほぼ解消。strict held-out は it50 で
# 0.016 (1/64) 単発、他 0.0。残る課題: フロンティアは T0=155 (~0.35) 付近、
# T0=110→0 の間が断絶 (0.09 → 0.0) — 「終端への橋」が未架設。
#
# 工夫 (1点): ladder 刻みを低 T0 側へシフトし、ladder9 で断絶した T0=110→0 を
# 95,80,65,50,35,20 で密に埋める ([155,125,110,95,80,65,50,35,0])。克服済みの
# 高 T0 (225,200,185,170) は外し、フロンティア〜終端に密度を集中。resume は
# ladder9 best.pt (全run最高到達点)。他は ladder9 と完全同一。
# ============================================================================
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""


training:
  algo: vmpo
  seed: 0
  resume_from: data/output/models/reinforce/case8_vmpo_ladder9/runs/20260613-073911__feature-poc-v-mpo__2830e71__seed0/best.pt
  iterations: 70
  episodes_per_iter: 96
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  heldout_eval:
    every: 10                # iter 0/10/20/30/40/50/60/69 (warm ~3分/eval)
    opponents: [strict_v1, baseline_jax_full]  # 真の強さ + 変化検出用の両観測
    episodes: 64             # バッチ償却で eval 時間は episodes にほぼ不変
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  handicap:
    enabled: false           # ladder-pool では不使用 (段選択 = f_var が担う)
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 0
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var
    priority_p: 4.0
    priority_ema: 0.7
    include_lite: false      # exploiter 構成: pool は strict ラダー + self のみ
    include_full: false
    include_v8: false
    include_strict: [strict_v1]
    force_strict_every: 0    # 不要: 中間段が常に選択可能 (EMA 鮮度問題が消滅)
    force_rung_low_every: 0  # ladder8 の全敗汚染を断つため素strict強制照射は廃止のまま
    # T0 時間窓型。フロンティアを低 T0 側へシフトし、ladder9 で断絶した
    # T0=110→0 を 95,80,65,50,35,20 で密刻み。克服済み高 T0 は外す。
    strict_ladder: [155, 125, 110, 95, 80, 65, 50, 35, 0]
    mix_strict: 0.6          # 60% strict ラダー (iter3 の工夫: フロンティア密度up)
    mix_self: 0.35           # 35% self snapshots / 残り 15% 最古 snapshot

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
