# case8 fast_probe — GPU ~20min observability/effect-check PoC config.
#
# Purpose (docs/plans/case8-pool-rl/09-experiment-scale-reduction.md):
#   Validate a measure's effectiveness in 20min on GPU while keeping the axes
#   that govern *validity of the effect check* intact. Scale-reduced entry
#   point for the L3 reduced-proxy-training stage.
#
# Kept (do NOT shrink — shrinking invalidates the effect check):
#   - horizon: 500   (games run ~497 turns; <500 → terminal reward never fires
#                     → win rate meaningless. memory: reinforce_horizon_terminal_reward_bug)
#   - network/batch  (hidden=192/heads=8/inducing=24/minibatch=128) — full, so
#                     measure A/B stays comparable
#   - episodes_per_iter: 8  (batch floor for noise suppression)
#
# Shrunk (governs compute, not validity):
#   - iterations: 20         (200+ → 20; trend/slope shows early)
#   - opponent: in-JAX only  (self_snapshot pool + baseline_jax_full; NO python_v*
#                             host hop, so rollout stays light → fits 20min)
#
# Recipe: case5 H4 winner (ratio shaping, coef=1.0) + case6 PFSP self-snapshot
# pool (f_hard prioritized). switch_iter=4 so the pool engages early.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 20
  episodes_per_iter: 8
  horizon: 500            # KEEP — terminal reward guard
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 5000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  # --- case5 best support reward (H4: ratio, coef=1.0) ---
  shaping_mode: ratio
  shaping_coef: 1.0
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  # --- case6 PFSP: in-JAX opponent pool (past-self + baseline_jax_full) ---
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 4      # push current model into the pool every 4 iters
    cap: 4                 # FIFO pool of up to 4 past-self snapshots
    late_full_prob: 0.4    # 40% baseline_jax_full, else a pooled past self
    priority: f_hard       # prioritize hard opponents by (1 - win_ema)^p
    priority_p: 2.0
    priority_ema: 0.7

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
