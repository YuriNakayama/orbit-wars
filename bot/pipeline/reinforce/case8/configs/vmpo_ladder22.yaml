# ============================================================================
# Ladder-pool iteration 22 (loop tick の工夫: 案A — 地力↑継続 + 素strict段を
# degenerate無しで強制訓練)。
#
# ladder21 深掘り (ladder21_strict_win_deepdive.md): RL健全性修正 A+B+C のうち
# C(no_op_bias 8→2)+B(adv_std_floor) が「弱体化strict 全段の訓練win を一様 +0.03-0.08
# 底上げ」する地力向上として実証された (over-fire是正 → fleet運用改善)。その裾が
# held-out strict_v1 3/64 (campaign最高) として漏れた。一方 A(skip) は T0=0段が
# win=0.005 で n_wins==0 閾値に漏れ不発、素strict断崖は不変。
#
# 工夫 (1点 = 「素strict段を健全に訓練する」の表裏):
#  C2: no_op_bias 2.0→1.0 — 実証された地力↑をさらに進める (over-fire是正)
#  A2: skip_update_win_thresh=0.05 — win<5%の degenerate段の更新をskip (ladder21の
#      n_wins==0 漏れを修正、T0=0段の entropy崩壊poisonを断つ)
#  force: force_rung_low_every=2 + strict_ladder末尾=0 — T0=0(素strict)段を2iter毎
#      強制照射し訓練量を確保。A2が崩壊を防ぐので「素strictを健全に大量訓練」が成立。
# B(adv_std_floor=0.1)は維持。resume ladder21 best.pt (full 0.807)。
# ============================================================================
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 1.0            # C2: 2.0→1.0 (over-fire是正をさらに、地力↑実証済)

bc_warmstart:
  enabled: false
  weights_path: ""


training:
  algo: vmpo
  seed: 0
  resume_from: data/output/models/reinforce/case8_vmpo_ladder21/runs/20260616-064800__feature-poc-v-mpo__377f159__seed0/best.pt
  iterations: 70
  episodes_per_iter: 192
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  terminal_scale: 1.0
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  skip_update_win_thresh: 0.05   # A2: win<5%の degenerate iter更新をskip (T0=0崩壊阻止)
  vmpo:
    adv_std_floor: 0.1           # B: 維持
  reverse_curriculum:
    enabled: false
  heldout_eval:
    every: 10
    opponents: [strict_v1, baseline_jax_full]
    episodes: 64
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  handicap:
    enabled: false
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 0
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var
    priority_p: 4.0
    priority_ema: 0.7
    include_lite: false
    include_full: false
    include_v8: false
    include_strict: [strict_v1]
    force_strict_every: 0
    force_rung_low_every: 2        # force: 2iter毎に最終entry(T0=0素strict)を強制照射
    # 末尾=0 (素strict)。force_rung_low が常にこの素strict段を選ぶ → 訓練量確保。
    strict_ladder: [225, 200, 185, 170, 155, 140, 125, 110, 0]
    mix_strict: 0.6
    mix_self: 0.35

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
