# ============================================================================
# PoC: BC warm-start × V-MPO — rulebase への勝率が学習で向上するかの 40 分検証。
#
# A/B 規律: vmpo_frozen.yaml から **bc_warmstart のみ** 変更 (enabled=false→true)。
# 他は全パラメータ同一。テスト対象 = 「BC 初期化が V-MPO の対 rulebase 勝率
# 軌跡を改善するか」(web 調査: AlphaStar / Generals.io / MimicBot の定石)。
#
# 進捗信号 (pipeline.md RL progress check):
#   - held-out: baseline_jax_full (in-JAX) 毎 iter — 学習中の固定相手曲線
#   - 学習後: ckpt_i000/i015/i030/best を実 baseline_v1 (Python rulebase) と
#     offline 対戦し勝率軌跡を測る (train/eval parity ギャップ対策で実物も見る)
#
# 注: kl_beta は V-MPO loss に未配線 (PPO 専用 hook) のため BC anchor なし。
# V-MPO 自身の trust-region (eps_alpha=0.01) が政策崩壊への保守性を担保する。
# ============================================================================
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: true              # ★PoC: vmpo_frozen から唯一の変更点
  weights_path: data/output/models/imitation/case9_per_planet/runs/20260512-080505__feature-imitation-data-volume-sweep__593a7c4__seed0/best.pt

training:
  algo: vmpo
  seed: 0
  iterations: 50
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  heldout_eval:
    every: 1
    opponent: baseline_jax_full
    episodes: 32
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var
    priority_p: 4.0
    priority_ema: 0.7
    include_lite: true
    include_v8: false

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
