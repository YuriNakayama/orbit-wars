# case8 H3: BC warm-start + RL refine — the key lever after H1/H2 showed
# from-scratch PPO collapses to a ~0.3 plateau vs the rulebase (entropy 16→10,
# no learning trend) regardless of opponent schedule or reward shaping.
#
# Start from the case9_per_planet imitation policy (already plays sensibly), so
# RL refines good behavior instead of exploring from scratch into mediocrity.
# kl_beta=0.5 anchors the policy to the BC reference so RL doesn't destroy the
# good init too fast. Keeps H2's dense differential reward (harmless, mild help).
#
# Schedule: noop(0-2) → baseline_jax_full(3-19). Train vs the target rulebase.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: true
  weights_path: data/output/models/imitation/case9_per_planet/runs/20260512-080505__feature-imitation-data-volume-sweep__593a7c4__seed0/best.pt

training:
  seed: 0
  iterations: 20
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 5000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.5            # anchor to BC reference (preserve good init)
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 3
    early: noop
    late: baseline_jax_full

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
