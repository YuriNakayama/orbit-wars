# case8 H0 PPO short run (~16 iter, algo=ppo): RunPod wiring verification on the
# real env. Confirms held-out vs python_v8 (real rulebase case8) + Elo are
# recorded each heldout step, and that f_var with the in-JAX 3-opp pool (case1
# lite + case8 baseline_jax_full + self_snapshot) keeps the per-iter match
# win-rate ~0.5.
#
# NOTE (post-mortem 2026-06-09): python_v8 must NOT go in the *train* pool. It is
# a host-callback (pure_callback) opponent; once it is a reachable opponent_mode
# in the rollout lax.switch, every training rollout pays the host hop and GPU
# sits at 0% (memory rollout_host_callback_bottleneck — first attempt stalled
# >10min on iter0). python_v8 belongs ONLY in held-out eval (a separate, infrequent
# rollout). The train pool uses the in-JAX rulebase proxies (lite≈case1 lite,
# full≈case1 full) + self snapshots, which are the same-strength 0.5 anchors PFSP
# needs. case8 (real) stays the fixed held-out yardstick.
# ~16 iter × ~25s ≈ 7min on RTX 4090. Per-iter ckpt+metrics to S3.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  algo: ppo
  seed: 0
  iterations: 16
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  heldout_eval:
    every: 4
    opponent: python_v8       # held-out = real rulebase case8 (fixed anchor)
    episodes: 32
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var           # ~even opponents (count-based ema converges)
    priority_p: 2.0
    priority_ema: 0.7
    include_lite: true        # case1 lite (in-JAX, fast)
    include_v8: false         # python_v8 host-callback => GPU stall; held-out only

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
