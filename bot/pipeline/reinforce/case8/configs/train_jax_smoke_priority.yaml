# Local smoke for H4 (PFSP f_hard prioritized sampling). switch_iter=2,
# snapshot_every=2 so the prioritized selector fires and the pool refreshes.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 6
  episodes_per_iter: 4
  horizon: 50
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  shaping_coef: 0.001
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.001
  kl_beta: 0.0
  ppo_epochs: 1
  minibatch_size: 64
  max_grad_norm: 0.5
  target_kl: null
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 2
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 2
    cap: 3
    priority: f_hard
    priority_p: 2.0
    priority_ema: 0.7

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
