# ============================================================================
# rulebase 蒸留クローン × V-MPO — PoC (poc_bc_result.md) の次の一手。
#
# PoC の診断: Kaggle 棋譜 BC は実 rulebase に 0/24 (traction なし)、pool の
# in-JAX 相手も anti-rulebase 信号を与えない。本 config は「教師」と「相手」の
# 両方を rulebase 化する:
#   - bc_warmstart: 実 baseline_v1 のミラー selfplay 633k frames から蒸留した
#     クローン (case9_rulebase) で初期化 → 出発点が rulebase の挙動を持つ
#   - opponent_pool.distilled_weights: 同じクローンを固定 NN 相手として PFSP
#     pool に追加 (mode=self_snapshot dispatch、ms forward、strict の per-turn
#     29s 問題なし) → rulebase 的挙動との対戦勾配が学習中ずっと存在する
#   - heldout_eval.opponent=distilled: 進捗 yardstick もクローン (毎 iter)
#
# vmpo_frozen からの差分は bc_warmstart / distilled_weights / heldout opponent
# のみ (他の学習 HP は凍結のまま)。判定は学習後 ckpt 軌跡 × 実 baseline_v1。
# ============================================================================
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: true
  weights_path: data/output/models/imitation/case9_rulebase/runs/20260610-155129__feature-poc-v-mpo__680040f__seed0/best.pt

training:
  algo: vmpo
  seed: 0
  iterations: 50
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 20000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  dense_coef_ship: 0.003
  dense_coef_planet: 0.003
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  heldout_eval:
    every: 1
    opponent: distilled      # 進捗 yardstick = rulebase 蒸留クローン
    episodes: 32
    seed: 777000
    ref_elo: 1500.0
    agent_elo_init: 1500.0
    elo_k: 32.0
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 4
    early: noop
    late: pool
  opponent_pool:
    snapshot_every: 8
    cap: 6
    late_full_prob: 0.4
    priority: f_var
    priority_p: 4.0
    priority_ema: 0.7
    include_lite: true
    include_v8: false
    distilled_weights:
      - data/output/models/imitation/case9_rulebase/runs/20260610-155129__feature-poc-v-mpo__680040f__seed0/best.pt

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
