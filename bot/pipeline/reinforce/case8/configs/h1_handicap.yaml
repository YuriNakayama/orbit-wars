# case8 H1: handicap curriculum — noop → baseline_jax_lite (winnable handicap)
# → baseline_jax_full (target rulebase). Research 処方B (handicapping): start
# from a beatable difficulty so the agent gets gradient, then ramp to the real
# rulebase. Addresses the "0 vs strong rulebase" gradient-death problem.
#
# Schedule (20 iter, ~20min on RTX 4090):
#   iter 0-2  : noop              (free action-space exploration)
#   iter 3-13 : baseline_jax_lite (handicap — 11 iters to build skill)
#   iter 14-19: baseline_jax_full (target rulebase)
#
# Kept from fast_probe_gpu: h500, batch32, ratio shaping coef=1.0.
model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: false
  weights_path: ""

training:
  seed: 0
  iterations: 20
  episodes_per_iter: 32
  horizon: 500
  lr: 3.0e-5
  lr_end: 3.0e-6
  lr_schedule_steps: 5000
  weight_decay: 1.0e-5
  gamma: 0.995
  gae_lambda: 0.95
  shaping_mode: ratio
  shaping_coef: 1.0
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.02
  kl_beta: 0.0
  ppo_epochs: 2
  minibatch_size: 128
  max_grad_norm: 0.5
  target_kl: 0.02
  # 3-stage handicap curriculum
  opponent: curriculum
  opponent_curriculum:
    switch_iter: 3          # iter 0-2 noop
    early: noop
    mid: baseline_jax_lite  # iter 3-13 handicap (winnable)
    mid_switch_iter: 14
    late: baseline_jax_full # iter 14-19 target rulebase

output:
  run_dir: data/output/models/reinforce/case8_train_jax/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
