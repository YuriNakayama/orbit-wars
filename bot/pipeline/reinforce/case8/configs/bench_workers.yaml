# Bench config: 5-iter smoke with rollout_workers tuning to measure wall-clock
# speedup vs the iter1 serial baseline (7h / 100 iter ≈ 4.5min/iter).
#
# Same hyperparameters as train.yaml otherwise — only the iter count is reduced
# and rollout_workers is set. Outcomes are not meant to be used for adoption;
# this is a wall-clock benchmark only.

model:
  hidden: 192
  attn_heads: 8
  inducing_points: 24
  encoder_layers: 4
  head_dropout: 0.0
  ship_log_std_init: 0.5
  no_op_bias: 8.0

bc_warmstart:
  enabled: true
  weights_path: data/output/models/imitation/case9_per_planet/runs/20260512-080505__feature-imitation-data-volume-sweep__593a7c4__seed0/best.pt

training:
  seed: 0
  iterations: 5
  episodes_per_iter: 16
  lr: 1.0e-4
  weight_decay: 1.0e-5
  gamma: 0.99
  gae_lambda: 0.95
  shaping_coef: 0.001
  clip_eps: 0.2
  value_coef: 0.5
  entropy_coef: 0.001
  kl_beta: 0.5
  ppo_epochs: 2
  minibatch_size: 256
  max_grad_norm: 0.5
  target_kl: 0.05
  opponent: baseline_v1
  # 0 = auto (cpu_count - 1). RTX 4090 SECURE pods typically expose 16-32 vCPU.
  rollout_workers: 0

output:
  run_dir: data/output/models/reinforce/case8/runs
  weights_filename: best.pt
  metrics_filename: metrics.json
  run_meta_filename: run.json
