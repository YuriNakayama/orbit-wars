# imitation/case4: Kaggle tutorial-style candidate head BC port
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case4/train.parquet
  out_val: data/mart/imitation/case4/val.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  # smoke test: 30 episode で preprocess を 数分に短縮 (本番回す前の e2e 検証用)
  max_episodes: 30

model:
  planet_in_dim: 35
  global_in_dim: 20
  cand_in_dim: 14
  cand_k: 8
  hidden: 128

train:
  case: case4
  batch_size: 256
  # smoke test: 2 epochs で train を 数分に短縮。本番に戻すときは 15 へ
  epochs: 2
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    cand: 1.0
    use_class_weights: true
    class_weight_beta: 0.999
    label_smoothing: 0.05
  weights_out: pipeline/imitation/case4/policy/weights.pt

inference:
  temperature: 1.0
