name: Cron Kaggle Scrape

on:
  schedule:
    - cron: "0 18 * * *"  # JST 03:00 (UTC 18:00)
  workflow_dispatch:
    inputs:
      top:
        description: "Leaderboard top N teams"
        required: false
        type: number
        default: 120
      modes:
        description: "Comma-separated modes (1v1,ffa4)"
        required: false
        type: string
        default: "1v1,ffa4"
      limit_per_team:
        description: "Max episodes per team (0 = all)"
        required: false
        type: number
        default: 0

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kaggle-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DVC_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DVC_AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ap-northeast-1
      PYTHONUNBUFFERED: "1"
      SCRAPE_TOP: ${{ inputs.top || 120 }}
      SCRAPE_MODES: ${{ inputs.modes || '1v1,ffa4' }}
      SCRAPE_LIMIT_PER_TEAM: ${{ inputs.limit_per_team || 0 }}

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev
        working-directory: bot

      - name: DVC pull existing kaggle episodes
        # `--project bot` は uv に bot の venv を使わせるだけで cwd は repo root のまま。
        # `--directory bot` を使うと cwd が bot/ になり DVC が bot/data/... を
        # 探してしまうため (`workspace not found` + `matches.dvc does not exist`) NG。
        run: uv run --project bot dvc pull data/lake/kaggle_episodes/matches.dvc

      - name: Scrape phase 1 (plan)
        run: |
          # SCRAPE_LIMIT_PER_TEAM=0 → omit the flag so the CLI default (None=all) applies.
          limit_args=()
          if [ "${SCRAPE_LIMIT_PER_TEAM}" -gt 0 ]; then
            limit_args=(--limit-per-team "${SCRAPE_LIMIT_PER_TEAM}")
          fi
          uv run --project bot python -m dataset kaggle scrape-plan \
            --plan-out /tmp/scrape_plan.json \
            --top "${SCRAPE_TOP}" \
            --modes "${SCRAPE_MODES}" \
            "${limit_args[@]}" \
            2>&1 | tee /tmp/scrape_plan.log

      - name: Scrape phase 2 (fetch)
        run: |
          uv run --project bot python -m dataset kaggle scrape-fetch \
            --plan-in /tmp/scrape_plan.json \
            --workers 32 \
            --rate-capacity 240 \
            --rate-window 60 \
            2>&1 | tee /tmp/scrape_fetch.log

      - name: DVC commit kaggle episodes
        # cancel/timeout 時も periodic flush 済みの matches/ を救出するため
        # `if: always()` で実行する。`dvc commit -f` は対象 .dvc のみ書き換えるので
        # 他 stage の重複定義に引きずられず安全。
        if: always()
        run: |
          if [ ! -d data/lake/kaggle_episodes/matches ]; then
            echo "matches dir missing; skip"
            exit 0
          fi
          uv run --project bot dvc commit -f data/lake/kaggle_episodes/matches.dvc

      - name: Detect data changes
        id: diff
        if: always()
        run: |
          # `dvc add` / `dvc commit` は matches.dvc を書き換えるが、`git add` 自動実行は
          # `dvc add` のみ。cancel 時にも救出したいので `git diff` (unstaged 含む)
          # と HEAD 比較の両方を確認する。
          if git diff --quiet HEAD -- data/lake/kaggle_episodes/matches.dvc; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: DVC push
        if: always() && steps.diff.outputs.changed == 'true'
        run: uv run --project bot dvc push

      - name: Create pull request
        if: always() && steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: data/lake/kaggle_episodes/matches.dvc
          commit-message: "chore(data): refresh kaggle episodes"
          branch: chore/kaggle-data-refresh
          delete-branch: true
          title: "chore(data): refresh kaggle episodes"
          body: |
            Automated refresh of `data/lake/kaggle_episodes/matches.dvc`.

            - Trigger: `${{ github.event_name }}`
            - Top: `${{ env.SCRAPE_TOP }}` / Modes: `${{ env.SCRAPE_MODES }}` / Limit per team: `${{ env.SCRAPE_LIMIT_PER_TEAM == '0' && 'all' || env.SCRAPE_LIMIT_PER_TEAM }}`
            - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          labels: data-refresh

      - name: Upload scrape logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kaggle-scrape-log
          path: |
            /tmp/scrape_plan.log
            /tmp/scrape_fetch.log
            /tmp/scrape_plan.json
          if-no-files-found: ignore
          retention-days: 30
