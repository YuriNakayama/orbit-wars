name: CI Bot

on:
  pull_request:
    paths:
      - "**"
      - ".github/workflows/ci-bot.yml"
    types:
      - opened
      - synchronize
      - ready_for_review
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - name: Cache uv / mypy / ruff
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
            .mypy_cache
            .pytest_cache
            .ruff_cache
          key: ${{ runner.os }}-tools-${{ hashFiles('bot/uv.lock', 'bot/pyproject.toml', 'simulator/python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-tools-

      - name: Cache cargo registry + target
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            simulator/rust/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('simulator/rust/Cargo.lock', 'simulator/rust/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install bot deps (uv sync)
        run: uv sync --locked --all-extras --dev
        working-directory: bot

      - name: Install simulator/python deps
        run: uv sync --all-extras --dev
        working-directory: simulator/python

      - name: Build + install Rust extension into bot venv
        run: |
          uv run --directory bot python -m pip install --quiet 'maturin>=1.7,<2'
          cd simulator/rust
          VIRTUAL_ENV="${{ github.workspace }}/bot/.venv" \
            "${{ github.workspace }}/bot/.venv/bin/maturin" develop --release --quiet

      - name: Ruff format check (bot)
        run: uv run ruff format --check .
        working-directory: bot

      - name: Ruff lint (bot)
        run: uv run ruff check --output-format=github .
        working-directory: bot

      - name: MyPy type check (bot)
        run: uv run mypy --config-file pyproject.toml .
        working-directory: bot

      - name: Cargo fmt check (simulator/rust)
        run: cargo fmt --check
        working-directory: simulator/rust

      - name: Cargo clippy (simulator/rust)
        run: cargo clippy --no-default-features --all-targets -- -D warnings
        working-directory: simulator/rust

      - name: Cargo test (simulator/rust)
        run: cargo test --no-default-features
        working-directory: simulator/rust

      - name: Pytest (simulator/python vendored)
        run: uv run pytest orbit_wars_vendor/tests -q
        working-directory: simulator/python

      - name: Pytest (bot)
        run: uv run pytest tests -m "not slow"
        working-directory: bot

      - name: Pytest (simulator/rust facade + parity, fast slice)
        run: uv run pytest ../simulator/rust/python/tests -m "not slow" -q
        working-directory: bot
