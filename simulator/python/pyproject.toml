[project]
name = "orbit-wars-vendor"
version = "0.1.0"
description = "Apache-2.0 vendored copy of kaggle_environments orbit_wars (reference implementation)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Yuri Nakayama", email = "yuri620620@gmail.com" }]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_wars_vendor"]

[dependency-groups]
dev = ["pytest>=8.3.4"]

[tool.pytest.ini_options]
addopts = ["-ra", "--strict-config", "-p", "no:cacheprovider"]
testpaths = ["orbit_wars_vendor/tests"]
cache_dir = ".pytest_cache"
