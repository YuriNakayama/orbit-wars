[project]
name = "orbit-wars-jax"
version = "0.1.0"
description = "JAX-native reimplementation of the Orbit Wars env (jit + vmap, parity-tested against the vendored upstream sim)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Yuri Nakayama", email = "yuri620620@gmail.com" }]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_wars_jax"]

[dependency-groups]
dev = ["pytest>=8.3.4"]
