[project]
name = "orbit-wars-sim"
version = "0.1.0"
description = "Backend-agnostic adapter that runs Orbit Wars through the vendored Python sim or the Rust sim, selected by ORBIT_WARS_BACKEND"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Yuri Nakayama", email = "yuri620620@gmail.com" }]
# orbit_wars_rust (default) and orbit_wars_vendor (ORBIT_WARS_BACKEND=python)
# are loaded lazily via sys.path so the native Rust wheel stays optional; only
# kaggle_environments is required unconditionally.
dependencies = [
    "kaggle-environments",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orbit_wars_sim"]

[dependency-groups]
dev = ["pytest>=8.3.4"]
