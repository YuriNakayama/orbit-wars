# Phase 1 feature-engineering iter on imitation/case2.
# Diff vs il_baseline.yaml:
#   - data.featurizer: baseline -> phase1
#   - data.out_*: separate parquet so baseline run is preserved for diffing
#   - model.planet_in_dim: 18 -> 33  (added: nearest_ally/neutral_dist, orbit
#     prediction at t={1,2,4,8}, incoming ETA & ships split by ally/enemy,
#     threat_pressure_long)
#   - model.global_in_dim: 11 -> 16  (added: next_comet_eta_norm,
#     my/enemy_total_ships_frac, my_total_prod_frac, score_diff_norm)
#   - train.weights_out: dedicated weights file
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  featurizer: phase1
  out_train: data/mart/imitation/case2/train_phase1.parquet
  out_val: data/mart/imitation/case2/val_phase1.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null
  # Phase 1 final: drop group D (threat_pressure_long, col 32) — single ablation
  # winner. See docs/plans/case2_feature_engineering.md for the comparison.
  ablation:
    planet_cols: [32]
    global_cols: []

model:
  planet_in_dim: 33
  global_in_dim: 16
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 3.0
    from_focal_alpha: 0.75
    target_label_smoothing: 0.15
    target_entropy_bonus: 0.05
    use_target_class_weights: true
    target_class_weight_beta: 0.9999
    use_ships_class_weights: false
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.0
  weights_out: pipeline/imitation/case2/policy/weights_phase1.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: null
  target_temperature: 0.8
  ships_temperature: 1.1
