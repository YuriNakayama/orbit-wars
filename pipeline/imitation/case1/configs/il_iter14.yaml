# Phase 3 / iter14: target head re-tuning after iter13 ships-focal regression (5/300 -> 3/300).
# Drops ships focal, instead relaxes target class-weight beta and label smoothing
# to reduce over-regularization on the template distribution.
# Change vs iter11:
#   - target_class_weight_beta: 0.9999 -> 0.999     (softer minority boost)
#   - target_label_smoothing: 0.15 -> 0.10          (sharper templates on majority)
#   - target_entropy_bonus: 0.05 -> 0.02            (less uniformity pressure)
# Rationale: iter11 showed target-head F1 drift with 0.9999 beta; softer weighting
# may let the dominant-but-informative templates (T_NEAREST_ENEMY 32%) retain
# gradient mass while still lifting NO_OP / REINFORCE_* tails.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case1/train_q30.parquet
  out_val: data/mart/imitation/case1/val_q30.parquet
  rating_quantile: 0.30
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 11
  global_in_dim: 6
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  target_oversample:
    enabled: true
    power: 0.5
    aggregate: mean
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 3.0
    from_focal_alpha: 0.75
    target_label_smoothing: 0.10
    target_entropy_bonus: 0.02
    use_target_class_weights: true
    target_class_weight_beta: 0.999
    use_ships_class_weights: false
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.0
  weights_out: pipeline/imitation/case1/policy/weights_iter14.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: 4
  target_temperature: 0.8
  ships_temperature: 1.1
