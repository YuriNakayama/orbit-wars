# Phase 3 / iter13: ships head multiclass focal.
# Change vs iter11 canonical:
#   + loss_weights.ships_focal_gamma: 2.0
#   + loss_weights.ships_focal_alpha: [0.25, 0.25, 0.25, 0.15] (bucket 3 down-weighted)
# Rationale: iter8 ordinal smoothing failed because bucket-3 majority (66%)
# generated dominant gradients. Multiclass focal discounts well-classified
# bucket-3 samples by (1 - p_3)^γ, shifting learning capacity to buckets 0-2
# where the ships head is under-fit. α_3=0.15 provides an additional static
# reduction on class 3.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case1/train_q30.parquet
  out_val: data/mart/imitation/case1/val_q30.parquet
  rating_quantile: 0.30
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 11
  global_in_dim: 6
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  target_oversample:
    enabled: true
    power: 0.5
    aggregate: mean
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 3.0
    from_focal_alpha: 0.75
    target_label_smoothing: 0.15
    target_entropy_bonus: 0.05
    use_target_class_weights: true
    target_class_weight_beta: 0.9999
    use_ships_class_weights: false
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.0
    ships_focal_gamma: 2.0
    ships_focal_alpha: [0.25, 0.25, 0.25, 0.15]
  weights_out: pipeline/imitation/case1/policy/weights_iter13.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: 4
  target_temperature: 0.8
  ships_temperature: 1.1
