# Phase 3 / iter12: preprocess-time minority frame duplication.
# Change vs iter11 (rating_quantile 0.30 + oversample mean):
#   + data.duplicate_minority: 2x copies for frames firing weak-F1 templates
#     (T_NEAREST_NEUTRAL_LOW=0, T_HIGH_PROD_NEUTRAL=2, T_HIGH_PROD_ENEMY=3,
#      T_REINFORCE_FRONTLINE=4, T_REINFORCE_WEAKEST=5).
#   - target_oversample disabled (duplicate replaces sampler-side augmentation).
# Rationale: iter10/10b show sampler-based oversampling yields only small
# per-class F1 shifts because the same row is redrawn. Preprocess-time row
# duplication increases the true count of minority frames so each epoch sees
# them against more partner rows, generating genuinely new gradient steps.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case1/train_q30_dup.parquet
  out_val: data/mart/imitation/case1/val_q30.parquet
  rating_quantile: 0.30
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null
  duplicate_minority:
    enabled: true
    multiplier: 2
    templates: [0, 2, 3, 4, 5]

model:
  planet_in_dim: 11
  global_in_dim: 6
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  target_oversample:
    enabled: false
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 3.0
    from_focal_alpha: 0.75
    target_label_smoothing: 0.15
    target_entropy_bonus: 0.05
    use_target_class_weights: true
    target_class_weight_beta: 0.9999
    use_ships_class_weights: false
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.0
  weights_out: pipeline/imitation/case1/policy/weights_iter12.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: 4
  target_temperature: 0.8
  ships_temperature: 1.1
