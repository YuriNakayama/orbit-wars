# Phase 2 / iter8: ships_head class-weighted CE + ordinal-aware smoothing.
# Change vs il_iter7.yaml:
#   - loss_weights.use_ships_class_weights: true
#   - loss_weights.ships_ordinal_smoothing: 0.1
# target_head changes from iter7 are held so we measure the incremental ships effect.
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case1/train.parquet
  out_val: data/mart/imitation/case1/val.parquet
  rating_quantile: 0.50
  val_split: 0.10
  modes: ["1v1"]
  max_episodes: null

model:
  planet_in_dim: 11
  global_in_dim: 6
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 2.0
    from_focal_alpha: 0.25
    target_label_smoothing: 0.15
    target_entropy_bonus: 0.05
    use_target_class_weights: true
    target_class_weight_beta: 0.9999
    use_ships_class_weights: true
    ships_class_weight_beta: 0.9999
    ships_ordinal_smoothing: 0.1
  weights_out: pipeline/imitation/case1/policy/weights_iter8.pt

inference:
  from_threshold: 0.31
  min_fire_topk: 1
  max_fire_count: 4
  target_temperature: 0.8
  ships_temperature: 1.1
