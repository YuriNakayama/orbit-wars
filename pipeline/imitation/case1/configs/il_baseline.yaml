# Imitation Learning Baseline (imitation/case1) — default config
seed: 0

data:
  kaggle_index_root: data/kaggle_episodes/matches/index.parquet
  replay_dir: data/kaggle_episodes/matches/replays
  out_train: data/lake/imitation_case1/train.parquet
  out_val: data/lake/imitation_case1/val.parquet
  rating_quantile: 0.75      # top 25% by agent_*_rating_mu
  val_split: 0.10            # 10% of episodes for validation
  modes: ["1v1", "ffa4"]
  max_episodes: null          # null = use all matching episodes
  ships_buckets: 5

model:
  planet_in_dim: 11
  global_in_dim: 6
  hidden: 64
  ships_buckets: 5

train:
  batch_size: 256
  epochs: 10
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0              # parquet 全読みなので worker 不要
  loss_weights:
    from: 1.0
    target: 1.0
    ships: 0.5
  weights_out: pipeline/imitation/case1/policy/weights.pt

inference:
  from_threshold: 0.05
