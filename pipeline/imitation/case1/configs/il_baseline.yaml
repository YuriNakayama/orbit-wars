# Imitation Learning Baseline (imitation/case1) — default config
seed: 0

data:
  kaggle_index_root: data/lake/kaggle_episodes/matches/index.parquet
  replay_dir: data/lake/kaggle_episodes/matches/replays
  out_train: data/mart/imitation/case1/train.parquet
  out_val: data/mart/imitation/case1/val.parquet
  rating_quantile: 0.50      # at-least-one seat in top 50% (loser side included)
  val_split: 0.10            # 10% of episodes for validation
  modes: ["1v1"]
  max_episodes: null          # null = use all matching episodes

model:
  planet_in_dim: 11
  global_in_dim: 6
  hidden: 128
  ships_buckets: 4

train:
  batch_size: 256
  epochs: 15
  lr: 1.0e-3
  weight_decay: 1.0e-4
  num_workers: 0              # parquet 全読みなので worker 不要
  loss_weights:
    from: 1.0
    target: 2.0
    ships: 0.5
    from_pos_weight: 8.5
    from_focal_gamma: 2.0
    from_focal_alpha: 0.25
    target_label_smoothing: 0.1
    target_entropy_bonus: 0.05
  weights_out: pipeline/imitation/case1/policy/weights.pt

inference:
  from_threshold: 0.05
