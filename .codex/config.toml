#:schema https://developers.openai.com/codex/config-schema.json

# Keep Codex in the workspace sandbox, but avoid repeated approval prompts for
# normal development commands. Commands that need to escape the sandbox are
# governed by .codex/rules/default.rules.
approval_policy = "never"
sandbox_mode = "danger-full-access"
web_search = "cached"
model_instructions_file = "AGENTS.md"

[features]
multi_agent = true
shell_tool = true
unified_exec = true
