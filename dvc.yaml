# DVC pipeline definitions.
# All stages read parameters from repo-root params.yaml via each CLI's internal loader.
# Commands use `uv run --directory bot` so the `pipeline.*` package is importable,
# while deps/outs are expressed as paths relative to the repo root.
stages:
  preprocess_imitation_case1:
    cmd: uv run --directory bot python -m pipeline.imitation.case1.training.preprocess
    deps:
      - data/lake/kaggle_episodes/matches
      - bot/pipeline/imitation/case1/training/preprocess.py
      - bot/pipeline/imitation/case1/policy/featurizer.py
      - bot/pipeline/imitation/case1/policy/geometry.py
      - bot/pipeline/imitation/case1/policy/templates.py
    params:
      - seed
      - data
    outs:
      - data/mart/imitation/case1/train.parquet
      - data/mart/imitation/case1/val.parquet

  train_imitation_case1:
    cmd: uv run --directory bot python -m pipeline.imitation.case1.training.train
    deps:
      - data/mart/imitation/case1/train.parquet
      - data/mart/imitation/case1/val.parquet
      - bot/pipeline/imitation/case1/training/train.py
      - bot/pipeline/imitation/case1/training/losses.py
      - bot/pipeline/imitation/case1/training/dataset.py
      - bot/pipeline/imitation/case1/policy/model.py
    params:
      - seed
      - model
      - train
    outs:
      - bot/pipeline/imitation/case1/policy/weights.pt

  eval_imitation_case1:
    cmd: uv run --directory bot python -m pipeline.imitation.case1.evaluation.eval_vs_baseline
    deps:
      - bot/pipeline/imitation/case1/policy/weights.pt
      - bot/pipeline/imitation/case1/evaluation/eval_vs_baseline.py
      - bot/src/evaluation/vs_baseline.py
    params:
      - evaluation
    metrics:
      - data/mart/imitation/case1/eval_metrics.json:
          cache: false

  preprocess_imitation_case5:
    cmd: uv run --directory bot python -m pipeline.imitation.case5.training.preprocess --config pipeline/imitation/case5/configs/il_case5.yaml
    deps:
      - data/lake/kaggle_episodes/matches
      - bot/pipeline/imitation/case5/training/preprocess.py
      - bot/pipeline/imitation/case5/policy/featurizer.py
      - bot/pipeline/imitation/case5/policy/timeline.py
      - bot/pipeline/imitation/case5/policy/geometry.py
      - bot/pipeline/imitation/case5/policy/templates.py
      - bot/pipeline/imitation/case5/configs/il_case5.yaml
    outs:
      - data/mart/imitation/case5/train.parquet
      - data/mart/imitation/case5/val.parquet

  train_imitation_case5:
    cmd: uv run --directory bot python -m pipeline.imitation.case5.training.train --config pipeline/imitation/case5/configs/il_case5.yaml
    deps:
      - data/mart/imitation/case5/train.parquet
      - data/mart/imitation/case5/val.parquet
      - bot/pipeline/imitation/case5/training/train.py
      - bot/pipeline/imitation/case5/training/losses.py
      - bot/pipeline/imitation/case5/training/dataset.py
      - bot/pipeline/imitation/case5/policy/model.py
      - bot/pipeline/imitation/case5/configs/il_case5.yaml
    outs:
      - bot/pipeline/imitation/case5/policy/weights.pt

  # case8 の preprocess / train stage は onstart が直接 python module を
  # 呼び出して実行するため dvc.yaml には登録しない。stage に outs を宣言すると
  # onstart の `dvc add data/mart/imitation/case8/*.parquet` が
  # "overlaps with an output of stage" で拒否されるため。
  # case5 と同等の pathway: stage 未登録、onstart 内部で preprocess → dvc add
  # → dvc push、parquet.dvc stub と weights.pt.dvc stub が git に push される
  # 仕組み。手動 `dvc repro` 用途は当面想定しない。
