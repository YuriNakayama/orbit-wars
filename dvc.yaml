# DVC pipeline definitions.
# All stages read parameters from repo-root params.yaml via each CLI's internal loader.
# Commands use `uv run --directory bot` so the `pipeline.*` package is importable,
# while deps/outs are expressed as paths relative to the repo root.
stages:
  preprocess_imitation_case1:
    cmd: uv run --directory bot python -m pipeline.imitation.case1.training.preprocess
    deps:
      - data/lake/kaggle_episodes/matches
      - bot/pipeline/imitation/case1/training/preprocess.py
      - bot/pipeline/imitation/case1/policy/featurizer.py
      - bot/pipeline/imitation/case1/policy/geometry.py
      - bot/pipeline/imitation/case1/policy/templates.py
    params:
      - seed
      - data
    outs:
      - data/mart/imitation/case1/train.parquet
      - data/mart/imitation/case1/val.parquet

  train_imitation_case1:
    cmd: uv run --directory bot python -m pipeline.imitation.case1.training.train
    deps:
      - data/mart/imitation/case1/train.parquet
      - data/mart/imitation/case1/val.parquet
      - bot/pipeline/imitation/case1/training/train.py
      - bot/pipeline/imitation/case1/training/losses.py
      - bot/pipeline/imitation/case1/training/dataset.py
      - bot/pipeline/imitation/case1/policy/model.py
    params:
      - seed
      - model
      - train
    outs:
      - bot/pipeline/imitation/case1/policy/weights.pt

  eval_imitation_case1:
    cmd: uv run --directory bot python -m pipeline.imitation.case1.evaluation.eval_vs_baseline
    deps:
      - bot/pipeline/imitation/case1/policy/weights.pt
      - bot/pipeline/imitation/case1/evaluation/eval_vs_baseline.py
      - bot/src/evaluation/vs_baseline.py
    params:
      - evaluation
    metrics:
      - data/mart/imitation/case1/eval_metrics.json:
          cache: false
