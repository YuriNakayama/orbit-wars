      - bot/pipeline/imitation/case3/training/preprocess.py
      - bot/pipeline/imitation/case3/policy/featurizer_phase2.py
      - bot/pipeline/imitation/case3/policy/geometry.py
      - bot/pipeline/imitation/case3/policy/templates.py
      - bot/pipeline/imitation/case3/configs/il_phase2.yaml
    outs:
      - data/mart/imitation/case3/train_phase2_fixed.parquet
      - data/mart/imitation/case3/val_phase2_fixed.parquet

